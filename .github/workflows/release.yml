name: Publish 'Memento'
run-name: Publish 'Memento' (${{ inputs.release-type }})

on:
  workflow_dispatch:
    inputs:
      release-type:
        description: 'Art des Releases'
        required: true
        default: 'Release'
        type: choice
        options:
          - Release
          - Alpha
      release-tag:
        description: 'neuer Tag (manuell)'
        required: false
      build:
        description: 'Release erstellen'
        required: false
        default: true
        type: boolean
      full-changelog:
        description: 'vollständiges Changelog erstellen'
        required: false
        default: true
        type: boolean

permissions: {}

jobs:
  call-blueprint:
    uses: arcane-wizard-dev/.github/.github/workflows/release_blueprint.yml@main
    with:
      release-type: ${{ inputs.release-type }}
      release-tag: ${{ inputs.release-tag }}
      build: ${{ inputs.build }}
      full-changelog: ${{ inputs.full-changelog }}
      cf-project-id: ${{ vars.CF_PROJECT_ID }}
      wago-project-id: ${{ vars.WAGO_PROJECT_ID }}
    secrets: inherit
